<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket Lab</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#0f172a;color:#e2e8f0;
    font:15px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    display:flex;justify-content:center;padding:2rem 1rem;
  }
  .wrap{width:100%;max-width:34rem}
  h1{font-size:1.4rem;margin:0 0 .25rem}
  .sub{color:#94a3b8;font-size:.85rem;margin:0 0 1.5rem}

  .bar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
       background:#1e293b;border:1px solid #334155;border-radius:12px;padding:.75rem 1rem;margin-bottom:1rem}
  .dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex:none}
  .dot.open{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .dot.closed{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
  .status{font-weight:600;font-size:.85rem}
  .muted{color:#94a3b8;font-size:.8rem}
  .grow{flex:1}

  form{display:flex;gap:.5rem;margin-bottom:1rem}
  input{
    flex:1;background:#1e293b;border:1px solid #334155;color:#e2e8f0;
    border-radius:10px;padding:.6rem .8rem;font:inherit;font-size:.9rem;outline:none;
  }
  input:focus{border-color:#6366f1}
  button{
    background:#4f46e5;color:#fff;border:0;border-radius:10px;
    padding:.6rem 1.1rem;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;
  }
  button:disabled{opacity:.4;cursor:not-allowed}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
  li{background:#1e293b;border:1px solid #334155;border-left-width:3px;border-radius:8px;padding:.5rem .75rem;font-size:.85rem}
  li.chat{border-left-color:#6366f1}
  li.tick{border-left-color:#0ea5e9;color:#94a3b8}
  li.count{border-left-color:#eab308;color:#fde68a}
  li.system{border-left-color:#94a3b8;color:#94a3b8}
  li.error{border-left-color:#ef4444;color:#fca5a5}
  .who{color:#a5b4fc;font-weight:600}
  .time{color:#64748b;font-size:.75rem;margin-left:.4rem}
</style>
</head>
<body>
<div class="wrap">

  <h1>WebSocket Lab</h1>
  <p class="sub">Open this page in two tabs and watch them talk to each other.</p>

  <div class="bar">
    <span class="dot" id="dot"></span>
    <span class="status" id="status">Connecting…</span>
    <span class="grow"></span>
    <span class="muted" id="count">— online</span>
  </div>

  <form id="form">
    <input id="input" placeholder="Type a message…" autocomplete="off">
    <button id="send" type="submit" disabled>Send</button>
  </form>

  <ul id="log"></ul>
</div>

<script>
  const dot    = document.getElementById("dot");
  const status = document.getElementById("status");
  const count  = document.getElementById("count");
  const form   = document.getElementById("form");
  const input  = document.getElementById("input");
  const send   = document.getElementById("send");
  const log    = document.getElementById("log");

  const add = (cls, html) => {
    const li = document.createElement("li");
    li.className = cls;
    li.innerHTML = html;
    log.prepend(li);
  };

  /**
   * `WebSocket` is built into the browser. Nothing is installed for this.
   *
   * Note ws:// not http://. Same host, same port — location.host is
   * "localhost:4000" — but a different protocol on that same connection.
   */
  const socket = new WebSocket(`ws://${location.host}`);

  /* There are exactly four events. That is the whole API surface. */

  // 1. open — the 101 Switching Protocols handshake succeeded
  socket.addEventListener("open", () => {
    dot.className = "dot open";
    status.textContent = "Connected";
    send.disabled = false;
    add("system", "Connection open — the HTTP request was upgraded.");
  });

  // 2. message — the server sent something. Can happen at ANY time.
  socket.addEventListener("message", (event) => {
    // event.data is always a string (or Blob for binary). The server sent
    // JSON, so we parse it and switch on the `type` we invented ourselves.
    const msg = JSON.parse(event.data);

    if (msg.type === "welcome") {
      add("system", msg.text);
    }
    else if (msg.type === "chat") {
      add("chat", `<span class="who">#${msg.from}</span> ${msg.text}<span class="time">${msg.at}</span>`);
    }
    else if (msg.type === "count") {
      count.textContent = `${msg.count} online`;
      add("count", `${msg.count} client${msg.count === 1 ? "" : "s"} connected`);
    }
    else if (msg.type === "tick") {
      add("tick", `server tick — ${msg.at} <span class="time">(nobody asked for this)</span>`);
    }
  });

  // 3. close — connection ended. Note: nothing reconnects on its own.
  socket.addEventListener("close", () => {
    dot.className = "dot closed";
    status.textContent = "Disconnected";
    send.disabled = true;
    count.textContent = "— online";
    add("error", "Connection closed. Nothing will reconnect — you would have to write that yourself.");
  });

  // 4. error — something went wrong. Always followed by close.
  socket.addEventListener("error", () => {
    add("error", "Socket error.");
  });


  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    // send() only works while readyState is OPEN — it throws otherwise.
    socket.send(text);

    input.value = "";
    input.focus();
  });
</script>
</body>
</html>
